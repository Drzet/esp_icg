name: ESP-IDF build

on:
  push:
    branches:
      - main
      - feature/usb-phone-preview
      - investigate/6.0.3-af-enabled
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-P4 firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py --version
          python --version
          idf.py set-target esp32p4
          idf.py build

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp_icg-usb-phone-esp32p4
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flash_args
            build/flasher_args.json
            sdkconfig
            dependencies.lock
            build/bootloader/*.bin
            build/partition_table/*.bin
          if-no-files-found: error
