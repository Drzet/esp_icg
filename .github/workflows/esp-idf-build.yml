name: ESP-IDF build

on:
  push:
    branches:
      - main
      - test/imx708-author-snapshot-idf54
      - feature/imx708-live-preview-idf54
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout ESP-IDF 5.4.0
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v5.4
          path: esp-idf-5.4.0
          submodules: recursive

      - name: Install ESP-IDF tools
        shell: bash
        run: ./esp-idf-5.4.0/install.sh esp32p4

      - name: Build ESP32-P4 firmware
        shell: bash
        run: |
          source ./esp-idf-5.4.0/export.sh
          idf.py --version
          python --version
          idf.py set-target esp32p4
          idf.py build

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: imx708-live-preview-idf54
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
          if-no-files-found: error
